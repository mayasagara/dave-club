<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dave - Bookshelf</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="poster">
      <header class="poster-head">
        <div class="poster-head__title-line">
          <h1 class="poster-title">
            <img class="poster-logo" src="logo.svg" alt="dave" width="239" height="88" />
          </h1>
          <div class="poster-head__actions">
            <button
              class="poster-menu-btn"
              type="button"
              aria-label="Open menu"
              aria-expanded="false"
              aria-controls="site-menu"
            >
              &#9776;
            </button>
          </div>
        </div>
        <nav class="poster-menu" id="site-menu" aria-label="Main menu">
          <button class="poster-menu-close-btn" type="button" aria-label="Close menu">&times;</button>
          <a href="home.html" class="poster-menu__item">Home</a>
          <a href="index.html" class="poster-menu__item">News</a>
          <a href="sessions.html" class="poster-menu__item">Sessions</a>
          <a href="notes.html" class="poster-menu__item">Notes</a>
          <a href="proposals.html" class="poster-menu__item">Proposals</a>
          <a href="bookshelf.html" class="poster-menu__item is-active" aria-current="page">Bookshelf</a>
        </nav>
      </header>

      <main class="bookshelf-page" aria-label="Bookshelf covers">
        <section class="bookshelf-lane">
          <h2 class="bookshelf-lane__title">Reading</h2>
          <ul class="bookshelf-strip" id="bookshelf-reading"></ul>
        </section>

        <section class="bookshelf-lane">
          <h2 class="bookshelf-lane__title">Proposed</h2>
          <ul class="bookshelf-strip" id="bookshelf-proposed"></ul>
        </section>

        <section class="bookshelf-lane">
          <h2 class="bookshelf-lane__title">Read</h2>
          <ul class="bookshelf-strip" id="bookshelf-read"></ul>
        </section>
      </main>
    </div>
    <script>
      (function () {
        var menuBtn = document.querySelector(".poster-menu-btn");
        var menu = document.getElementById("site-menu");
        var menuCloseBtn = menu ? menu.querySelector(".poster-menu-close-btn") : null;
        if (menuBtn && menu) {
          function closeMenu() {
            menu.classList.remove("is-open");
            menuBtn.setAttribute("aria-expanded", "false");
          }

          menuBtn.addEventListener("click", function () {
            var willOpen = !menu.classList.contains("is-open");
            menu.classList.toggle("is-open", willOpen);
            menuBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
          });

          document.addEventListener("click", function (event) {
            if (!menu.contains(event.target) && !menuBtn.contains(event.target)) {
              closeMenu();
            }
          });

          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") closeMenu();
          });

          if (menuCloseBtn) {
            menuCloseBtn.addEventListener("click", closeMenu);
          }
        }

        var readingEl = document.getElementById("bookshelf-reading");
        var proposedEl = document.getElementById("bookshelf-proposed");
        var readEl = document.getElementById("bookshelf-read");
        var readingSeed = [
          {
            title: "",
            author: "",
            cover: "books/proposed/7b848403edd9eb8c73219277f4a5c0f5.jpg"
          }
        ];
        function makeBook(book, idx) {
          var li = document.createElement("li");
          li.className = "shelf-book";

          var cover = document.createElement("div");
          cover.className = "shelf-book__cover shelf-book__cover--" + (book.tone || ["a", "b", "c", "d", "e", "f"][idx % 6]);
          if (book.placeholder) {
            cover.classList.add("shelf-book__cover--placeholder");
          }

          if (book.cover) {
            var image = document.createElement("img");
            image.className = "shelf-book__image";
            image.src = book.cover;
            image.alt = "Cover of " + (book.title || "Untitled");
            cover.appendChild(image);
            li.appendChild(cover);
            return li;
          }

          var title = document.createElement("span");
          title.className = "shelf-book__title";
          title.textContent = book.title || "Untitled";

          var author = document.createElement("span");
          author.className = "shelf-book__author";
          author.textContent = book.author || "Unknown";

          cover.appendChild(title);
          cover.appendChild(author);
          li.appendChild(cover);
          return li;
        }

        function renderLane(target, items) {
          target.innerHTML = "";
          items.forEach(function (book, idx) {
            target.appendChild(makeBook(book, idx));
          });
        }

        var proposedCovers = [
          "books/proposed/1a1b6f5953ac78f0f7f2a86a95764e78.jpg",
          "books/proposed/1c50a1137d569e3ff21c4a95b4c23768.jpg",
          "books/proposed/20d2651e747d88fc71dce3647e06a463.jpg",
          "books/proposed/322b0b72084c5c40fe9d69e48d7f96b9.jpg",
          "books/proposed/3d2ecdd3b167e124c216a25d085c655c.jpg",
          "books/proposed/465d01a2760c0fd1fac79bf09590699e.jpg",
          "books/proposed/47f75c0c9eb061d14abf96743da47897.jpg",
          "books/proposed/49f8b5ef3c9ba917e080668929da6c37.jpg",
          "books/proposed/4bbe8c743057e712a2243339981d0569.jpg",
          "books/proposed/57f3c8e26f7841e92acba841eec6c9c1.jpg",
          "books/proposed/5bec1abfbbcf931c57ea54153e2e1ee6.jpg",
          "books/proposed/61m2XYRVFRL._AC_UF894,1000_QL80_.jpg",
          "books/proposed/6943cd18d4fe3c4cb16a03a17024ac24.jpg",
          "books/proposed/6c5ecf9cfc2e280184131d99f9e72582.jpg",
          "books/proposed/6ea53525e038462d0c87ba6c799796b3.jpg",
          "books/proposed/73abe4ca9cb595671af2973ea478bb49.jpg",
          "books/proposed/79d19a1786ad8883c4d911fe31f25517.jpg",
          "books/proposed/93b86c8a786926a7574a709a803f0550.jpg",
          "books/proposed/99189369427bb67624872abcfbeab279.jpg",
          "books/proposed/9c2288e60ff20fd91eb342a57d514a2e.jpg",
          "books/proposed/abafe4c0c8c86262fb73c2cbff616dc1.jpg",
          "books/proposed/b423c49032838f2627b3b45b5f4b7605.jpg",
          "books/proposed/bde6a6e1794314eb102e058482ce5109.jpg",
          "books/proposed/be637e13f995a037ddadde351a82e6f7.jpg",
          "books/proposed/c03e253494f73ddfec173d9f2fd23373.jpg",
          "books/proposed/c61f40ac9df8167960ee721c54facdaa.jpg",
          "books/proposed/d0b6a0ef299702e3046b1854b073bf9f.jpg",
          "books/proposed/d7393c82d3d0c691f2ed8cb63988b3ea.jpg",
          "books/proposed/e85f467a3afdfeaac9d2fd03e401f5cf.jpg",
          "books/proposed/e9f59c83c3d41d3ed437bf77d1cbeb12.jpg",
          "books/proposed/f2d2a80670f84dd56e509fee28d67820.jpg"
        ];
        var proposedBooks = proposedCovers.map(function (coverPath, idx) {
          return {
            title: "Proposed Book " + (idx + 1),
            author: "",
            cover: coverPath
          };
        });
        var readBooks = [];

        renderLane(readingEl, readingSeed);
        renderLane(proposedEl, proposedBooks);
        renderLane(readEl, readBooks);
      })();
    </script>
  </body>
</html>
