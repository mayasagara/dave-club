<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dave - Notebook</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="poster">
      <header class="poster-head">
        <div class="poster-head__title-line">
          <h1 class="poster-title">
            <img class="poster-logo" src="logo.svg" alt="dave" width="239" height="88" />
          </h1>
          <div class="poster-head__actions">
            <button
              class="poster-menu-btn"
              type="button"
              aria-label="Open menu"
              aria-expanded="false"
              aria-controls="site-menu"
            >
              &#9776;
            </button>
          </div>
        </div>
        <nav class="poster-menu" id="site-menu" aria-label="Main menu">
          <button class="poster-menu-close-btn" type="button" aria-label="Close menu">&times;</button>
          <a href="home.html" class="poster-menu__item">Home</a>
          <a href="index.html" class="poster-menu__item">News</a>
          <a href="sessions.html" class="poster-menu__item">Sessions</a>
          <a href="notes.html" class="poster-menu__item is-active" aria-current="page">Notebook</a>
          <a href="proposals.html" class="poster-menu__item">Proposals</a>
          <a href="bookshelf.html" class="poster-menu__item">Bookshelf</a>
        </nav>
      </header>

      <section class="poster-write" aria-label="Notebook columns">
        <div class="poster-write-cell">
          <label class="poster-write-label" for="notes-col-1">Quotes</label>
          <textarea id="notes-col-1" class="poster-textarea" rows="12"></textarea>
        </div>
        <div class="poster-write-cell">
          <label class="poster-write-label" for="notes-col-2">Notes</label>
          <textarea id="notes-col-2" class="poster-textarea" rows="12"></textarea>
        </div>
        <div class="poster-write-cell">
          <label class="poster-write-label" for="notes-col-3">Review</label>
          <textarea id="notes-col-3" class="poster-textarea" rows="12"></textarea>
        </div>
      </section>

    </div>
    <script>
      (function () {
        var menuBtn = document.querySelector(".poster-menu-btn");
        var menu = document.getElementById("site-menu");
        var menuCloseBtn = menu ? menu.querySelector(".poster-menu-close-btn") : null;
        if (menuBtn && menu) {
          function closeMenu() {
            menu.classList.remove("is-open");
            menuBtn.setAttribute("aria-expanded", "false");
          }

          menuBtn.addEventListener("click", function () {
            var willOpen = !menu.classList.contains("is-open");
            menu.classList.toggle("is-open", willOpen);
            menuBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
          });

          document.addEventListener("click", function (event) {
            if (!menu.contains(event.target) && !menuBtn.contains(event.target)) {
              closeMenu();
            }
          });

          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") closeMenu();
          });

          if (menuCloseBtn) {
            menuCloseBtn.addEventListener("click", closeMenu);
          }
        }

        var SUPABASE_URL = "https://bodzlwbeslynaqxamgpp.supabase.co";
        var SUPABASE_KEY = "sb_publishable_VWvuyM_-txwgj-jFTg_b6A_MB1yJI4y";
        var ids = ["notes-col-1", "notes-col-2", "notes-col-3"];
        var slotConfig = {
          "notes-col-1": { page: "sessions", slot: "session-col-2" },
          "notes-col-2": { page: "notes", slot: "notes-col-2" },
          "notes-col-3": { page: "notes", slot: "notes-col-3" }
        };
        var saveTimers = {};
        var textareas = {};
        var lastSaved = {};

        function apiRequest(path, options) {
          return fetch(SUPABASE_URL + path, Object.assign({
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json"
            }
          }, options || {}));
        }

        function parseError(response, fallbackMessage) {
          return response.text().then(function (text) {
            var detail = text;
            try {
              var parsed = JSON.parse(text);
              detail = parsed.message || parsed.error_description || parsed.error || text;
            } catch (e) {}
            throw new Error(fallbackMessage + " (" + response.status + "): " + (detail || "Unknown error"));
          });
        }

        function saveSlot(elementId, value) {
          var cfg = slotConfig[elementId];
          var payload = [{ page: cfg.page, slot: cfg.slot, content: value }];
          return apiRequest("/rest/v1/page_notes?on_conflict=page,slot", {
            method: "POST",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              Prefer: "resolution=merge-duplicates,return=minimal"
            },
            body: JSON.stringify(payload)
          }).then(function (response) {
            if (!response.ok) return parseError(response, "Failed to save notes");
            lastSaved[elementId] = value;
          }).catch(function (error) {
            console.error(error && error.message ? error.message : error);
          });
        }

        function queueSave(elementId, value) {
          if (saveTimers[elementId]) {
            clearTimeout(saveTimers[elementId]);
          }
          saveTimers[elementId] = setTimeout(function () {
            saveSlot(elementId, value);
          }, 350);
        }

        function rowsByPageSlot(rows) {
          var map = {};
          (rows || []).forEach(function (row) {
            map[row.page + ":" + row.slot] = row.content || "";
          });
          return map;
        }

        function loadNotes() {
          return Promise.all([
            apiRequest("/rest/v1/page_notes?page=eq.notes&select=slot,content", { method: "GET" }),
            apiRequest("/rest/v1/page_notes?page=eq.sessions&select=slot,content", { method: "GET" })
          ]).then(function (responses) {
            if (!responses[0].ok) return parseError(responses[0], "Failed to load notes");
            if (!responses[1].ok) return parseError(responses[1], "Failed to load quotes");
            return Promise.all([responses[0].json(), responses[1].json()]).then(function (payloads) {
              var notesRows = payloads[0].map(function (row) {
                return { page: "notes", slot: row.slot, content: row.content };
              });
              var sessionRows = payloads[1].map(function (row) {
                return { page: "sessions", slot: row.slot, content: row.content };
              });
              return rowsByPageSlot(notesRows.concat(sessionRows));
            });
          }).then(function (byKey) {
            ids.forEach(function (id) {
              var ta = textareas[id];
              if (!ta) return;
              var cfg = slotConfig[id];
              var next = byKey[cfg.page + ":" + cfg.slot] || "";
              if (document.activeElement !== ta && ta.value !== next) {
                ta.value = next;
              }
              lastSaved[id] = next;
            });
          }).catch(function (error) {
            console.error(error && error.message ? error.message : error);
          });
        }

        ids.forEach(function (id) {
          var ta = document.getElementById(id);
          if (!ta) return;
          textareas[id] = ta;
          ta.addEventListener("input", function () {
            var value = ta.value;
            if (lastSaved[id] === value) return;
            queueSave(id, value);
          });
        });

        loadNotes();
        setInterval(loadNotes, 5000);
        window.addEventListener("focus", loadNotes);
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) loadNotes();
        });
      })();
    </script>
  </body>
</html>
